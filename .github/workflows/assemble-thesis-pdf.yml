name: Temporary dissertation PDF verification
on:
  push:
    branches:
      - thesis-pdf-exact-upload-20261121
permissions:
  contents: write
jobs:
  assemble:
    if: github.event.head_commit.message == 'Stage original dissertation for checksum-verified PDF upload'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the exact PDF, verify checksum, and clean staging files
        shell: bash
        run: |
          set -euo pipefail
          cat .thesis-upload/chunk-*.b64 | base64 --decode > assets/files/riya-basak-dissertation.pdf
          echo "fc3197c53b14eed829b952d4e69ded284af7491aea33e75fd250d53dbb962136  assets/files/riya-basak-dissertation.pdf" | sha256sum --check
          test "$(wc -c < assets/files/riya-basak-dissertation.pdf)" -eq 20141938
          git rm -r .thesis-upload
          git rm .github/workflows/assemble-thesis-pdf.yml
          git add assets/files/riya-basak-dissertation.pdf
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add byte-identical 54-page dissertation PDF"
          git push origin HEAD:thesis-pdf-exact-upload-20261121

name: Install exact latest CV

on:
  push:
    branches:
      - cv-news-update-temp
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cv-news-update-temp

      - name: Download exact public Drive PDF
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 \
            "https://drive.google.com/uc?export=download&id=1zqVDARB5A7vctg3QdAC7TtG41TiU9SOU" \
            -o assets/files/riya-basak-cv.pdf
          echo "32f1ade1917b55e3adf203516d5c7f31cd429064765b4c63b6abdc9fd28dd79b  assets/files/riya-basak-cv.pdf" | sha256sum -c -

      - name: Commit exact CV asset
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/files/riya-basak-cv.pdf
          if git diff --cached --quiet; then
            echo "CV already matches the exact Drive PDF."
            exit 0
          fi
          git commit -m "Replace website CV with exact latest PDF"
          git push origin HEAD:cv-news-update-temp

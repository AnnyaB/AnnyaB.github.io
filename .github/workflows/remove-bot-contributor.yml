name: Remove bot contributor attribution

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  rewrite:
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Rewrite bot-authored commits to AnnyaB identity
        run: |
          set -euo pipefail
          git filter-branch -f --env-filter '
          if [ "$GIT_AUTHOR_NAME" = "github-actions[bot]" ]; then
            export GIT_AUTHOR_NAME="AB"
            export GIT_AUTHOR_EMAIL="rb23ack@herts.ac.uk"
          fi
          if [ "$GIT_COMMITTER_NAME" = "github-actions[bot]" ]; then
            export GIT_COMMITTER_NAME="AB"
            export GIT_COMMITTER_EMAIL="rb23ack@herts.ac.uk"
          fi
          ' -- main

      - name: Force-push cleaned history
        run: |
          set -euo pipefail
          git push --force origin main

      - name: Remove temporary cleanup files
        run: |
          set -euo pipefail
          git config user.name "AB"
          git config user.email "rb23ack@herts.ac.uk"
          git rm -f .mailmap .github/workflows/remove-bot-contributor.yml
          git commit -m "Remove temporary contributor cleanup"
          git push origin main

name: Install exact Drive CV

on:
  push:
    branches:
      - update-cv-news-aug2026
    paths:
      - '.github/workflows/cv-upload.yml'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: update-cv-news-aug2026

      - name: Download exact Drive PDF and verify
        shell: bash
        run: |
          set -euo pipefail
          URL='https://drive.usercontent.google.com/download?id=1EDrtSKCcj4Ol6cUuH54M1N-7ttquh4wt&export=download&confirm=t'
          curl -L --fail --retry 2 "$URL" -o /tmp/rb____cv.pdf
          test "$(wc -c < /tmp/rb____cv.pdf | tr -d ' ')" = '194423'
          test "$(sha256sum /tmp/rb____cv.pdf | awk '{print $1}')" = '043c1315b9dab6392af353481f63049031ab4eafc123c8970f5b0e0df53ab5d6'
          cp /tmp/rb____cv.pdf assets/files/riya-basak-cv.pdf
          rm -rf .cv-upload

      - name: Commit only the exact CV replacement
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- assets/files/riya-basak-cv.pdf
          git rm -r --ignore-unmatch .cv-upload
          git commit -m 'Update CV PDF from Drive'
          git push origin HEAD:update-cv-news-aug2026
